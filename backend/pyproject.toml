[project]
name = "relinquere-api"
version = "0.1.0"
description = "Backend API for Relinquere e-commerce platform"
readme = "README.md"
authors = [
    { name = "Mxrqzz", email = "rodrigo.marqsrf@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"
